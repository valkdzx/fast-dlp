[project]
name = "fast-dlp"
dynamic = ["version"]
description = "Fast YouTube downloader: up to 4K at full line speed, built-in merging without ffmpeg, plus Spotify, Yandex Music, SoundCloud, TikTok and more"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "valkdz"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["youtube", "downloader", "youtube-dl", "yt-dlp", "spotify", "soundcloud", "tiktok", "video", "music", "mp3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/valkdzx/fast-dlp"
Source = "https://github.com/valkdzx/fast-dlp"
Issues = "https://github.com/valkdzx/fast-dlp/issues"

[project.scripts]
fast-dlp = "fast_dlp.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fast_dlp", "fast_dlp.sources", "fast_dlp.web", "fast_dlp.web.static"]

[tool.setuptools.dynamic]
version = {attr = "fast_dlp.__version__"}

[tool.setuptools.package-data]
"fast_dlp.web.static" = ["*.html", "*.svg"]
