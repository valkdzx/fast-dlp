<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fast-dlp</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: rgba(255, 255, 255, .56);
    --faint: rgba(255, 255, 255, .32);
    --line: rgba(255, 255, 255, .12);
    --line-strong: rgba(255, 255, 255, .28);
    --surface: rgba(255, 255, 255, .04);
    --surface-2: rgba(255, 255, 255, .08);
    --ease: cubic-bezier(.2, .8, .2, 1);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: min(640px, 100% - 32px); margin: 0 auto; padding: 72px 0 96px; }
  ::selection { background: #fff; color: #000; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* appearance */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .rise { animation: rise .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }

  /* header */
  header { text-align: center; margin-bottom: 40px; }
  .logo { width: 88px; height: 88px; display: block; margin: 0 auto 20px; }
  .logo .bolt { transform-origin: 50% 50%; animation: bolt-in .9s var(--ease) both .1s; }
  .logo .speed line { animation: speed 1.8s var(--ease) infinite; }
  .logo .speed line:nth-child(2) { animation-delay: .12s; }
  .logo .speed line:nth-child(3) { animation-delay: .24s; }
  .logo .base { transform-origin: 50% 50%; animation: base-in .7s var(--ease) both .45s; }
  body:not(.busy) .logo .speed line { animation-play-state: paused; }
  @keyframes bolt-in { from { opacity: 0; transform: translateY(-18px) scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes base-in { from { transform: scaleX(0); } to { transform: none; } }
  @keyframes speed { 0% { transform: translateX(0); opacity: 1; } 60% { transform: translateX(-14px); opacity: .2; } 100% { transform: translateX(0); opacity: 1; } }
  h1 { font-size: 34px; letter-spacing: -.02em; margin: 0 0 8px; font-weight: 700; }
  .lead { margin: 0 auto; max-width: 460px; color: var(--muted); }

  /* search */
  form.search { display: flex; gap: 8px; margin-bottom: 28px; }
  input, button, select { font: inherit; color: inherit; }
  .field {
    flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; outline: none; transition: border-color .25s, background .25s, box-shadow .25s;
  }
  .field::placeholder { color: var(--faint); }
  .field:focus { border-color: var(--line-strong); background: var(--surface-2); box-shadow: 0 0 0 4px rgba(255,255,255,.06); }
  .btn {
    border: 0; border-radius: var(--radius); padding: 14px 22px; background: var(--fg); color: #000; font-weight: 600;
    cursor: pointer; transition: transform .18s var(--ease), opacity .2s, box-shadow .25s; white-space: nowrap;
  }
  .btn:hover { box-shadow: 0 6px 28px rgba(255,255,255,.18); transform: translateY(-1px); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: default; box-shadow: none; transform: none; }
  .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line-strong); }
  .btn.big { width: 100%; padding: 18px; font-size: 17px; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .error { color: #fff; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius);
           padding: 12px 16px; margin-bottom: 24px; animation: rise .4s var(--ease) both; }
  .error::before { content: attr(data-prefix); font-weight: 600; }
  .langs { position: absolute; top: 16px; right: 16px; z-index: 5; display: flex; gap: 2px; padding: 3px; border-radius: 999px;
           border: 1px solid var(--line); background: rgba(0,0,0,.6); backdrop-filter: blur(8px); animation: fade .6s var(--ease) both .3s; }
  .langs button { border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em;
                  padding: 5px 10px; border-radius: 999px; cursor: pointer; transition: background .25s, color .25s; }
  .langs button.on { background: #fff; color: #000; }

  /* skeleton */
  .skeleton { display: grid; gap: 12px; }
  .sk { border-radius: 10px; background: linear-gradient(90deg, var(--surface) 0%, rgba(255,255,255,.1) 50%, var(--surface) 100%);
        background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* video card */
  .video { margin-bottom: 32px; }
  .thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: var(--surface); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transform: scale(1.04);
               transition: opacity .6s var(--ease), transform 1.2s var(--ease); }
  .thumb img.ok { opacity: 1; transform: none; }
  .thumb .len { position: absolute; right: 12px; bottom: 12px; background: rgba(0,0,0,.78); padding: 2px 8px; border-radius: 6px; font-size: 13px; }
  .video h2 { font-size: 20px; line-height: 1.3; margin: 16px 0 4px; letter-spacing: -.01em; }

  /* settings */
  .group { padding: 20px 0; border-top: 1px solid var(--line); }
  .label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .label b { font-weight: 600; }
  .label span { color: var(--muted); font-size: 13px; }

  .seg { position: relative; display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .seg button { position: relative; z-index: 1; flex: 1; border: 0; background: none; padding: 10px 8px; border-radius: 9px;
                cursor: pointer; color: var(--muted); transition: color .25s; }
  .seg button.on { color: #000; }
  .seg button:disabled { opacity: .3; cursor: default; }
  .seg .pill { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; border-radius: 9px; background: #fff;
               transition: transform .35s var(--ease), width .35s var(--ease); }

  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
  .chip { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px;
          cursor: pointer; transition: background .25s, border-color .25s, color .25s, transform .18s var(--ease); }
  .chip:hover { border-color: var(--line-strong); transform: translateY(-1px); }
  .chip .t { display: block; font-weight: 600; }
  .chip .s { display: block; font-size: 12px; color: var(--muted); transition: color .25s; }
  .chip.on { background: #fff; color: #000; border-color: #fff; }
  #templates { display: flex; flex-wrap: wrap; }
  #templates .chip { padding: 8px 12px; }
  .chip.on .s { color: rgba(0,0,0,.6); }

  .row { display: flex; gap: 8px; align-items: center; }
  .row .field { padding: 10px 12px; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 6px 0; cursor: pointer; }
  .switch input { appearance: none; width: 44px; height: 26px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line);
                  position: relative; cursor: pointer; transition: background .25s, border-color .25s; flex: none; margin: 0; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
                         background: var(--muted); transition: transform .3s var(--ease), background .25s; }
  .switch input:checked { background: #fff; border-color: #fff; }
  .switch input:checked::after { transform: translateX(18px); background: #000; }

  .timeline { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); margin: 14px 0 4px; overflow: hidden; }
  .timeline i { position: absolute; top: 0; bottom: 0; background: #fff; border-radius: 3px; transition: left .3s var(--ease), width .3s var(--ease); }
  .collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease), opacity .3s; opacity: 0; }
  .collapse.open { grid-template-rows: 1fr; opacity: 1; }
  .collapse > div { overflow: hidden; }

  input[type=range] { width: 100%; accent-color: #fff; }
  .preview { margin-top: 10px; font-size: 13px; color: var(--muted); word-break: break-all; }
  .preview b { color: var(--fg); font-weight: 500; }

  /* lists: playlists, albums, search results */
  .listhead { text-align: center; margin-bottom: 20px; }
  .listhead .site { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .listhead h2 { font-size: 22px; line-height: 1.3; margin: 6px 0 4px; letter-spacing: -.01em; }
  .listbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .btn.sm { padding: 7px 12px; font-size: 13px; font-weight: 500; }
  .entries { border: 1px solid var(--line); border-radius: var(--radius); max-height: 460px; overflow-y: auto; background: var(--surface); }
  .entry { display: grid; grid-template-columns: 22px 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; cursor: pointer;
           border-top: 1px solid var(--line); transition: background .2s, opacity .25s; animation: fade .4s var(--ease) both; }
  .entry:first-child { border-top: 0; }
  .entry:hover { background: var(--surface-2); }
  .entry.off { opacity: .45; }
  .entry input { appearance: none; width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--line-strong); margin: 0;
                 display: grid; place-items: center; cursor: pointer; transition: background .2s, border-color .2s; }
  .entry input:checked { background: #fff; border-color: #fff; }
  .entry input:checked::after { content: ""; width: 9px; height: 5px; border: solid #000; border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
  .entry .pic { width: 64px; aspect-ratio: 16 / 9; border-radius: 6px; background: var(--surface-2) center / cover no-repeat; }
  .entry .tt { min-width: 0; }
  .entry .tt b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry .tt span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry .d { font-size: 12px; color: var(--muted); }
  .hint { font-size: 13px; color: var(--faint); text-align: center; margin-top: 10px; }

  .summary { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 24px 0 14px; }
  .summary .size { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }

  /* downloads */
  .downloads h3 { font-size: 15px; margin: 48px 0 12px; font-weight: 600; }
  .job { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
         animation: rise .5s var(--ease) both; }
  .job .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .job .name { font-weight: 500; word-break: break-word; }
  .state { flex: none; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted);
           transition: background .3s, color .3s, border-color .3s; }
  .state.delivered { background: #fff; color: #000; border-color: #fff; }
  .bar { position: relative; height: 4px; border-radius: 2px; background: var(--surface-2); margin: 14px 0 8px; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fff; border-radius: 2px; transition: width .35s linear; }
  .job.streaming .bar i::after { content: ""; position: absolute; inset: 0;
       background: linear-gradient(90deg, transparent, rgba(0,0,0,.35), transparent); background-size: 60px 100%; animation: sheen 1s linear infinite; }
  .job.indeterminate .bar i { width: 30% !important; animation: slide 1.2s var(--ease) infinite; }
  @keyframes sheen { from { background-position: -60px 0; } to { background-position: 200% 0; } }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .job .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .job .actions { margin-top: 10px; }
  .job .actions .btn { padding: 8px 14px; font-size: 13px; }
  .check { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; }
  .check path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .5s var(--ease) forwards .1s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  footer { margin-top: 64px; text-align: center; font-size: 13px; color: var(--faint); }
  footer p { margin: 4px 0; }

  [hidden] { display: none !important; }
  @media (max-width: 480px) {
    main { padding-top: 48px; }
    h1 { font-size: 28px; }
    form.search { flex-direction: column; }
    .entry { grid-template-columns: 22px 1fr auto; }
    .entry .pic { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="langs" role="group" aria-label="Language"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
<main>
  <header class="rise">
    <svg class="logo" viewBox="0 0 256 256" aria-hidden="true">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#232838"/><stop offset="1" stop-color="#0E1016"/></linearGradient>
        <linearGradient id="bolt" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#FF5A36"/></linearGradient>
      </defs>
      <rect width="256" height="256" rx="56" fill="url(#bg)"/>
      <g class="speed" stroke="#fff" stroke-width="10" stroke-linecap="round">
        <line x1="72" y1="70" x2="110" y2="70" opacity=".85"/>
        <line x1="58" y1="96" x2="92" y2="96" opacity=".55"/>
        <line x1="44" y1="122" x2="72" y2="122" opacity=".3"/>
      </g>
      <path class="bolt" d="M152 32 L86 134 H124 L106 200 L178 96 H138 Z" fill="url(#bolt)" stroke="url(#bolt)" stroke-width="6" stroke-linejoin="round"/>
      <rect class="base" x="64" y="212" width="128" height="14" rx="7" fill="#fff"/>
    </svg>
    <h1>fast-dlp</h1>
    <p class="lead" data-i18n="lead"></p>
  </header>

  <form class="search rise" style="--i:2" id="search" autocomplete="off">
    <input class="field" id="url" type="text" inputmode="url" data-i18n-ph="url_ph" data-i18n-aria="url_aria" autofocus>
    <button class="btn" id="find" type="submit" data-i18n="find"></button>
  </form>

  <div id="error" class="error" hidden></div>

  <div id="loading" class="skeleton" hidden>
    <div class="sk" style="aspect-ratio:16/9;border-radius:18px"></div>
    <div class="sk" style="height:22px;width:80%"></div>
    <div class="sk" style="height:16px;width:45%"></div>
    <div class="sk" style="height:46px;margin-top:20px"></div>
    <div class="sk" style="height:46px"></div>
  </div>

  <section id="result" hidden>
    <div class="video rise">
      <div class="thumb" id="thumb-box"><img id="thumb" alt=""><span class="len num" id="len"></span></div>
      <h2 id="title"></h2>
      <div class="muted" id="sub"></div>
    </div>

    <div class="group rise" style="--i:1" id="g-file">
      <div class="label"><b data-i18n="what"></b><span id="file-note"></span></div>
      <div class="seg" data-key="fmode">
        <button type="button" data-v="original" data-i18n="as_is"></button>
        <button type="button" data-v="mp3" id="fmp3-btn" data-i18n="audio_mp3"></button>
      </div>
    </div>

    <div class="group rise" style="--i:1" id="g-mode">
      <div class="label"><b data-i18n="what"></b></div>
      <div class="seg" data-key="mode">
        <button type="button" data-v="video" data-i18n="video_audio"></button>
        <button type="button" data-v="audio" data-i18n="audio_only"></button>
        <button type="button" data-v="video_only" data-i18n="video_only"></button>
      </div>
    </div>

    <div class="group rise" style="--i:2" id="g-container">
      <div class="label"><b data-i18n="format"></b><span id="container-note"></span></div>
      <div class="seg" data-key="container">
        <button type="button" data-v="mp4">MP4</button>
        <button type="button" data-v="webm">WebM</button>
      </div>
    </div>

    <div class="group rise" style="--i:2" id="g-audio">
      <div class="label"><b data-i18n="audio_format"></b><span id="audio-note"></span></div>
      <div class="seg" data-key="audio_format">
        <button type="button" data-v="m4a">M4A</button>
        <button type="button" data-v="opus">Opus</button>
        <button type="button" data-v="mp3" id="mp3-btn">MP3</button>
      </div>
    </div>

    <div class="group rise" style="--i:3" id="g-quality">
      <div class="label"><b data-i18n="quality"></b><span id="quality-note"></span></div>
      <div class="chips" id="heights"></div>
    </div>

    <div class="group rise" style="--i:3" id="g-codec">
      <div class="label"><b data-i18n="codec"></b><span id="codec-note"></span></div>
      <div class="seg" data-key="codec">
        <button type="button" data-v="" data-i18n="auto"></button>
        <button type="button" data-v="avc1">H.264</button>
        <button type="button" data-v="av01">AV1</button>
      </div>
    </div>

    <div class="group rise" style="--i:3" id="g-mp3">
      <div class="label"><b data-i18n="mp3_bitrate"></b><span data-i18n="via_ffmpeg"></span></div>
      <div class="seg" data-key="mp3_quality">
        <button type="button" data-v="320k">320</button>
        <button type="button" data-v="256k">256</button>
        <button type="button" data-v="192k">192</button>
        <button type="button" data-v="128k">128</button>
        <button type="button" data-v="V0">V0</button>
        <button type="button" data-v="V2">V2</button>
      </div>
    </div>

    <div class="group rise" style="--i:4" id="g-cut">
      <label class="switch"><span><b data-i18n="section"></b><br><span class="muted" style="font-size:13px" data-i18n="section_note"></span></span><input type="checkbox" id="cut"></label>
      <div class="collapse" id="cut-box"><div>
        <div class="row" style="margin-top:12px">
          <input class="field num" id="start" placeholder="0:00" data-i18n-aria="start">
          <span class="muted">—</span>
          <input class="field num" id="end" data-i18n-ph="end_ph" data-i18n-aria="end">
        </div>
        <div class="timeline"><i id="tl"></i></div>
        <div class="muted num" style="font-size:13px" id="cut-note"></div>
      </div></div>
    </div>

    <div class="group rise" style="--i:5" id="g-meta">
      <div class="label"><b data-i18n="metadata"></b></div>
      <label class="switch"><span><span data-i18n="tags_video"></span><span id="rg-note"></span></span><input type="checkbox" id="tags" checked></label>
      <label class="switch"><span data-i18n="cover"></span><input type="checkbox" id="cover"></label>
    </div>

    <div class="group rise" style="--i:6">
      <div class="label"><b data-i18n="filename"></b></div>
      <div class="chips" id="templates"></div>
      <input class="field" id="template" style="width:100%;margin-top:8px;padding:10px 12px" spellcheck="false" data-i18n-aria="template">
      <div class="preview"><span data-i18n="fields"></span> {title} {author} {id} {height} {fps} {ext}<br><span data-i18n="file"></span> <b id="fname"></b></div>
    </div>

    <div class="group rise" style="--i:7">
      <div class="label"><b data-i18n="connections"></b><span class="num" id="conn-v">16</span></div>
      <input type="range" id="conn" min="1" max="32" value="16">
    </div>

    <div class="summary rise" style="--i:8">
      <div><div class="size num" id="size">—</div><div class="muted" id="what"></div></div>
    </div>
    <button class="btn big rise" style="--i:9" id="go" type="button" data-i18n="download"></button>
  </section>

  <section id="list" hidden>
    <div class="listhead rise"><div class="site" id="l-site"></div><h2 id="l-title"></h2><div class="muted" id="l-sub"></div></div>
    <div class="listbar rise" style="--i:1">
      <span class="muted num" id="l-count"></span>
      <span class="row"><button class="btn ghost sm" type="button" id="l-all" data-i18n="all"></button><button class="btn ghost sm" type="button" id="l-none" data-i18n="none"></button><button class="btn ghost sm" type="button" id="l-inv" data-i18n="invert"></button></span>
    </div>
    <div class="entries rise" style="--i:2" id="entries"></div>

    <div class="group rise" style="--i:3" id="lg-mode">
      <div class="label"><b data-i18n="what"></b><span id="l-mode-note"></span></div>
      <div class="seg" data-key="lmode">
        <button type="button" data-v="video" data-i18n="video_audio"></button>
        <button type="button" data-v="audio" data-i18n="audio_only"></button>
      </div>
    </div>
    <div class="group rise" style="--i:3" id="lg-audio">
      <div class="label"><b data-i18n="audio_format"></b><span data-i18n="other_sites"></span></div>
      <div class="seg" data-key="audio_format">
        <button type="button" data-v="m4a">M4A</button>
        <button type="button" data-v="opus">Opus</button>
        <button type="button" data-v="mp3" class="mp3-any">MP3</button>
      </div>
    </div>
    <div class="group rise" style="--i:3" id="lg-mp3">
      <div class="label"><b data-i18n="mp3_bitrate"></b><span data-i18n="via_ffmpeg"></span></div>
      <div class="seg" data-key="mp3_quality">

    if (!d.ffmpeg && mp3) S.fmode = "original";
    $("file-note").textContent = mp3 ? T("via_ffmpeg") : d.container === "HLS" ? T("hls_note") : T("bytes_note", { c: d.container });
    $("rg-note").textContent = "";
    document.querySelectorAll(".seg").forEach(paintSeg);
    $("size").textContent = mp3 ? (d.duration ? "≈ " + size(d.duration * KBPS[S.mp3_quality] * 125) : "—") : d.size ? size(d.size) : "—";
    $("what").textContent = mp3 ? "MP3 " + S.mp3_quality.replace("k", "") : d.size ? d.container : T("size_later", { c: d.container });
    S.template = $("template").value || "{title}";
    const ext = mp3 ? "mp3" : d.container === "HLS" ? "ts|mp4" : d.container.toLowerCase();
    const name = fill(S.template, { title: d.title, author: d.author, uploader: d.author, id: d.id, height: "", fps: "", ext });
    $("fname").textContent = `${name || "file"}.${ext}`;
    document.querySelectorAll("#templates .chip").forEach((c) => c.classList.toggle("on", c.dataset.t === S.template));
    $("go").disabled = false;
  }

  // -- lists -----------------------------------------------------------------------------------

  function renderList() {
    const d = S.info, audio = S.lmode === "audio";
    const hasYoutube = d.entries.some((e) => e.kind !== "direct");
    $("lg-mode").hidden = !hasYoutube;
    $("lg-quality").hidden = audio || !hasYoutube;
    $("lg-audio").hidden = !audio && hasYoutube;
    $("lg-mp3").hidden = !(S.audio_format === "mp3" && (audio || !hasYoutube));
    document.querySelectorAll(".mp3-any").forEach((b) => { b.disabled = !d.ffmpeg; });
    if (!d.ffmpeg && S.audio_format === "mp3") S.audio_format = "m4a";
    $("l-mode-note").textContent = d.entries.some((e) => e.kind === "track") ? T("tracks_yt") : "";
    document.querySelectorAll("#list .seg").forEach(paintSeg);
    document.querySelectorAll("#entries .entry").forEach((row) => {
      const on = S.sel.has(+row.dataset.n);
      row.classList.toggle("off", !on); row.querySelector("input").checked = on;
    });
    const n = S.sel.size;
    $("l-count").textContent = T("chosen", { n, total: d.entries.length }) + (d.count > d.entries.length ? T("shown_first", { n: d.entries.length, total: d.count }) : "");
    $("l-go").disabled = !n;
    $("l-go").textContent = n ? T("download_n", { n, files: plural(n, L[LANG].files) }) : T("none_chosen");
  }

  function showList(d) {
    S.sel = d.search ? new Set() : new Set(d.entries.map((e) => e.n));
    const music = d.entries.filter((e) => e.audio).length > d.entries.length / 2;
    S.lmode = music ? "audio" : "video";
    $("l-cover").checked = music;
    $("l-template").value = music ? "{author} - {title}" : "{title}";
    paintHead();
    $("entries").replaceChildren(...d.entries.map((e, i) => {
      const row = document.createElement("label"); row.className = "entry"; row.dataset.n = e.n;
      if (i < 30) row.style.animationDelay = i * 18 + "ms";
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = S.sel.has(e.n);
      cb.onchange = () => { if (cb.checked) S.sel.add(e.n); else S.sel.delete(e.n); render(); };
      const pic = document.createElement("span"); pic.className = "pic";
      if (e.thumbnail) pic.style.backgroundImage = `url("${encodeURI(e.thumbnail)}")`;
      const tt = document.createElement("span"); tt.className = "tt";
      const b = document.createElement("b"); b.textContent = e.title;
      const s = document.createElement("span"); s.className = "who"; s.dataset.author = e.author || ""; s.dataset.site = e.site || "";
      tt.append(b, s);
      const dur = document.createElement("span"); dur.className = "d num"; dur.textContent = e.duration ? clock(e.duration) : "";
      row.append(cb, pic, tt, dur); return row;
    }));
    labelRows();
  }
  function labelRows() {
    document.querySelectorAll("#entries .who").forEach((s) => { s.textContent = [s.dataset.author, siteName(s.dataset.site)].filter(Boolean).join(" · "); });
  }
  // Title lines of the current item or list, in the current language.
  function paintHead() {
    const d = S.info;
    if (d.kind === "list") {
      $("l-site").textContent = siteName(d.site);
      $("l-title").textContent = d.search ? T("search_title", { q: d.query }) : d.title || T("list");
      $("l-sub").textContent = `${d.count} ${plural(d.count, L[LANG].items)}`;
      return;
    }
    const via = d.track ? `${siteName(d.site)} → YouTube` : d.site !== "youtube" ? siteName(d.site) : "";
    const views = d.views ? T("views", { n: d.views.toLocaleString(LANG === "ru" ? "ru-RU" : "en-US") }) : "";
    $("sub").textContent = [d.author, via, views].filter(Boolean).join(" · ");
    $("end").placeholder = d.duration ? clock(d.duration) : T("end_ph");
  }
  $("l-all").onclick = () => { S.sel = new Set(S.info.entries.map((e) => e.n)); render(); };
  $("l-none").onclick = () => { S.sel.clear(); render(); };
  $("l-inv").onclick = () => { S.sel = new Set(S.info.entries.map((e) => e.n).filter((n) => !S.sel.has(n))); render(); };

  // -- search ----------------------------------------------------------------------------------
  function showError(msg) { const e = $("error"); e.hidden = !msg; e.textContent = msg || ""; if (msg) { e.style.animation = "none"; e.offsetHeight; e.style.animation = ""; } }

  async function find(url) {
    url = url.trim(); if (!url) return;
    showError(""); $("result").hidden = true; $("list").hidden = true; $("loading").hidden = false; $("find").disabled = true;
    document.body.classList.add("busy");
    try {
      const r = await fetch("/api/info?url=" + encodeURIComponent(url), { headers: { "X-Lang": LANG } });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.statusText);
      S.info = data; S.url = url; S.height = null; S.fps = null; S.codec = "";
      if (data.kind === "list") {
        showList(data);
        $("loading").hidden = true; $("list").hidden = false;
        $("list").querySelectorAll(".rise").forEach((el) => { el.style.animation = "none"; el.offsetHeight; el.style.animation = ""; });
        requestAnimationFrame(render);
        return;
      }
      if (data.kind === "file") { S.fmode = "original"; $("cover").checked = false; }
      if (data.track) { S.mode = "audio"; $("cover").checked = true; }
      const img = $("thumb"); img.classList.remove("ok"); img.onload = () => img.classList.add("ok");
      $("thumb-box").hidden = !data.thumbnail;
      if (data.thumbnail) img.src = data.thumbnail; else img.removeAttribute("src");
      $("len").textContent = data.duration ? clock(data.duration) : "";
      $("len").hidden = !data.duration;
      $("title").textContent = data.title;
      paintHead();
      if (!$("templates").childElementCount) {
        for (const t of data.templates) {
          const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.dataset.t = t;
          const s = document.createElement("span"); s.className = "t"; s.style.fontWeight = 500; s.style.fontSize = "13px"; s.textContent = t;
          b.append(s); b.onclick = () => { $("template").value = t; render(); }; $("templates").append(b);
        }
        $("template").value = S.template;
      }
      $("loading").hidden = true; $("result").hidden = false;
      $("result").querySelectorAll(".rise").forEach((el) => { el.style.animation = "none"; el.offsetHeight; el.style.animation = ""; });
      requestAnimationFrame(render);
    } catch (e) {
      $("loading").hidden = true; showError(e.message);
    } finally {
      $("find").disabled = false; document.body.classList.remove("busy");
    }
  }
  $("search").addEventListener("submit", (e) => { e.preventDefault(); find($("url").value); });
  $("url").addEventListener("paste", () => setTimeout(() => find($("url").value), 0));
  ["start", "end", "template"].forEach((id) => $(id).addEventListener("input", render));
  $("cut").addEventListener("change", render);
  $("conn").addEventListener("input", () => { S.connections = +$("conn").value; $("conn-v").textContent = S.connections; });

  // -- download --------------------------------------------------------------------------------

  $("go").addEventListener("click", async () => {
    const file = S.info.kind === "file";
    const sec = file ? null : section();
    const body = { url: S.url, mode: S.mode, container: S.container, audio_format: S.audio_format, codec: S.codec,
                   height: S.height, fps: S.fps, mp3_quality: S.mp3_quality, connections: S.connections,
                   tags: $("tags").checked, cover: $("cover").checked, template: S.template,
                   start: sec ? $("start").value : "", end: sec ? $("end").value : "" };
    if (file) Object.assign(body, S.fmode === "mp3" ? { mode: "audio", audio_format: "mp3" } : { mode: "original" });
    $("go").disabled = true; $("go").textContent = T("preparing"); showError("");
    document.body.classList.add("busy");
    try {
      const r = await fetch("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json", "X-Lang": LANG }, body: JSON.stringify(body) });
      const job = await r.json();
      if (!r.ok) throw new Error(job.error || r.statusText);
      addJob(job);
      start(job);
    } catch (e) { showError(e.message); }
    finally { $("go").disabled = false; $("go").textContent = T("download"); document.body.classList.remove("busy"); }
  });

  // A list goes out three files at a time: each running download holds one of the six
  // connections a browser keeps per site, and the status polling needs one too.
  const queue = []; let running = 0; const PARALLEL = 3;
  let failures = 0;
  $("l-go").addEventListener("click", () => {
    const base = { url: S.url, mode: S.lmode, container: "mp4", audio_format: S.audio_format, codec: "",
                   height: S.lheight ? +S.lheight : null, fps: null, mp3_quality: S.mp3_quality, connections: S.connections,
                   tags: $("l-tags").checked, cover: $("l-cover").checked, template: $("l-template").value || "{title}" };
    for (const e of S.info.entries) {
      if (!S.sel.has(e.n)) continue;
      const body = Object.assign({}, base, { entry: e.n });
      if (e.kind === "direct") body.mode = S.audio_format === "mp3" && (S.lmode === "audio" || e.audio) ? "audio" : "original";
      queue.push({ body, title: e.title });
    }
    $("downloads").hidden = false;
    $("downloads").scrollIntoView({ behavior: "smooth", block: "start" });
    pump();
  });
  function pump() {
    while (running < PARALLEL && queue.length) {
      const item = queue.shift(); running++;
      document.body.classList.add("busy");
      runOne(item).finally(() => { running--; if (!running && !queue.length) document.body.classList.remove("busy"); pump(); });
    }
  }
  async function runOne(item) {
    try {
      const r = await fetch("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json", "X-Lang": LANG }, body: JSON.stringify(item.body) });
      const job = await r.json();
      if (!r.ok) throw new Error(job.error || r.statusText);
      addJob(job);
      await new Promise((resolve) => { jobs.get(job.token).done = resolve; start(job); });
    } catch (e) {
      addJob({ token: "x" + (++failures), filename: item.title, state: "failed", error: e.message, sent: 0, size: null });
    }
  }

  function start(job) {
    const j = jobs.get(job.token);
    if (j) { j.data = Object.assign({}, j.data, { state: "ready" }); j.t0 = Date.now(); }
    const a = document.createElement("a"); a.href = job.download; a.download = job.filename; a.rel = "noopener";
    document.body.append(a); a.click(); a.remove();
    poll();
  }

  function addJob(job) {
    const el = document.createElement("div"); el.className = "job";
    el.innerHTML = `<div class="top"><div class="name"></div><span class="state"></span></div>
      <div class="bar"><i></i></div><div class="meta num"><span class="l"></span><span class="r"></span></div>
      <div class="actions" hidden><button class="btn ghost" type="button"></button></div>`;
    el.querySelector(".name").textContent = job.filename;
    el.querySelector(".actions button").onclick = () => start(jobs.get(job.token).data);
    $("jobs").prepend(el); $("downloads").hidden = false;
    jobs.set(job.token, { el, data: job });
    paintJob(job);
  }

  function paintJob(d) {
    const j = jobs.get(d.token); if (!j) return;
    j.data = d;
    const el = j.el;
    const stale = d.state === "ready" && j.t0 && Date.now() - j.t0 > 25000;     // the browser blocked it
    if (j.done && (FINAL.includes(d.state) || stale)) { j.done(); j.done = null; }
    el.className = "job " + d.state + (d.size == null && d.state === "streaming" ? " indeterminate" : "");
    const st = el.querySelector(".state");
    st.className = "state " + d.state;
    if (d.state === "delivered") st.innerHTML = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' + T("delivered");
    else st.textContent = L[LANG][d.state] && typeof L[LANG][d.state] === "string" ? T(d.state) : d.state;
    const pct = d.size ? Math.min(100, d.sent / d.size * 100) : (["delivered", "unconfirmed", "confirming"].includes(d.state) ? 100 : 0);
    el.querySelector(".bar i").style.width = pct + "%";
    const l = el.querySelector(".l"), r = el.querySelector(".r");
    l.textContent = d.size ? T("of", { a: size(d.sent), b: size(d.size) }) : d.sent ? size(d.sent) : "";
    if (d.state === "streaming") r.textContent = d.speed ? size(d.speed) + T("per_s") : "";
    else if (d.state === "delivered") r.textContent = d.elapsed != null ? T("in_s", { s: d.elapsed.toFixed(1) }) : "";
    else if (d.state === "unconfirmed") r.textContent = T("not_confirmed");
    else if (d.state === "aborted") r.textContent = T("aborted_note");
    else if (d.error) r.textContent = d.error;
    else r.textContent = "";
    el.querySelector(".actions").hidden = !d.download || !(["aborted", "failed"].includes(d.state) || stale);
    el.querySelector(".actions button").textContent = d.state === "ready" ? T("download") : T("again");
  }

  const FINAL = ["delivered", "unconfirmed", "failed", "aborted"];
  let polling = null;
  function poll() {
    if (polling) return;
    const tick = async () => {
      const active = [...jobs.values()].filter((j) => !FINAL.includes(j.data.state));
      if (!active.length) { polling = null; return; }
      try {
        const r = await fetch("/api/status?t=" + active.map((j) => j.data.token).join(","));
        const data = await r.json();
        for (const [t, d] of Object.entries(data)) if (d) paintJob(d);
      } catch (e) { /* the server may be restarting: keep trying */ }
      polling = setTimeout(tick, 400);
    };
    polling = setTimeout(tick, 150);
  }

  applyLang();
  const q = new URLSearchParams(location.search).get("url");
  if (q) { $("url").value = q; find(q); }
})();
</script>
</body>
</html>
